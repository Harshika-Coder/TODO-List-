<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <h1><b><u>TODO List</u></b><img src="Images/TODO.png" alt="TODOimage" width="50px"></h1>
    </header>
    <main>
        <div class="container">
            <div class="stats-container">
                <div class="details">
                    <!-- <h1>Tasks Complete</h1> -->
                    <p>Number of tasks you have completed!</p>
                    <div id="progressBar">
                        <div id="progress"></div>
                    </div>
                </div>
                <div class="stats-number">
                    <p id="completedTasks">0 / 0</p>
                </div>
            </div>

            <form action="">
                <input type="text" id="todo-input" placeholder="Add a new task..." required />
                <button id="submit-btn" type="submit"><b>Add Task</b></button>
            </form>
            <ul id="todo-list">
                <!-- TODO items will be added here dynamically -->
            </ul>
        </div>
    </main>

    <script src="./script.js"></script>
</body>

</html>
